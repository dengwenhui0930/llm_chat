<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kevin小助手</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--bg2:#fff;--sidebar:#1a1b1e;--sidebar-h:#2c2d31;--sidebar-a:#38393e;
  --txt:#1a1a2e;--txt2:#6b7280;--stxt:#e4e5e7;--stxt2:#9ca3af;
  --acc:#6366f1;--acc-h:#4f46e5;--acc-l:#eef2ff;--acc-g:rgba(99,102,241,.15);
  --bdr:#e2e4e9;--bdr-l:#f0f1f3;
  --ubg:#f8f9fb;--abg:#fff;
  --dng:#ef4444;--suc:#10b981;
  --r:14px;--rs:10px;--rx:6px;
  --sw:300px;--rw:320px;--mw:800px;
  --ff:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  --fm:'SF Mono','Fira Code','Consolas','Courier New',monospace;
  --sh:0 2px 8px rgba(0,0,0,.08);--sl:0 8px 24px rgba(0,0,0,.12);
}
html,body{height:100%;font:16px/1.5 var(--ff);color:var(--txt);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100%}

/* LEFT SIDEBAR */
#sidebar{width:var(--sw);min-width:var(--sw);background:var(--sidebar);color:var(--stxt);display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:1000;border-right:1px solid rgba(255,255,255,.06)}
.sb-hdr{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sb-logo{width:38px;height:38px;background:linear-gradient(135deg,var(--acc),#a78bfa);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:0 2px 8px rgba(99,102,241,.3)}
.sb-name{font-size:18px;font-weight:700;background:linear-gradient(135deg,#e4e5e7,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#new-chat-btn{width:100%;padding:12px 16px;background:rgba(255,255,255,.06);color:var(--stxt);border:1px solid rgba(255,255,255,.1);border-radius:var(--rs);font:500 15px var(--ff);cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
#new-chat-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
#session-list{flex:1;overflow-y:auto;padding:10px}
#session-list::-webkit-scrollbar{width:4px}
#session-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.si{display:flex;align-items:center;padding:12px 14px;border-radius:var(--rs);cursor:pointer;transition:all .15s;margin-bottom:3px;font-size:14.5px}
.si:hover{background:var(--sidebar-h)}
.si.active{background:var(--sidebar-a);box-shadow:inset 3px 0 0 var(--acc)}
.si-icon{margin-right:12px;font-size:17px;opacity:.7;flex-shrink:0}
.si.active .si-icon{opacity:1}
.si-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si-del{display:none;background:0;border:0;color:var(--stxt2);cursor:pointer;padding:5px;font-size:14px;border-radius:var(--rx);transition:all .15s}
.si:hover .si-del{display:flex}
.si-del:hover{color:var(--dng);background:rgba(239,68,68,.15)}
.sb-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--stxt2);display:flex;align-items:center;gap:6px}
.sb-dot{width:6px;height:6px;background:var(--suc);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* MAIN CHAT */
#chat-main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#top-bar{display:flex;align-items:center;padding:14px 24px;border-bottom:1px solid var(--bdr);background:var(--bg2);min-height:58px;box-shadow:0 1px 3px rgba(0,0,0,.06);z-index:10}
#sb-toggle{display:none;background:0;border:0;font-size:22px;cursor:pointer;padding:6px 10px;margin-right:12px;color:var(--txt);border-radius:var(--rx)}
#sb-toggle:hover{background:rgba(0,0,0,.05)}
#cur-title{flex:1;font:600 16px var(--ff);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-badge{display:inline-flex;align-items:center;gap:5px;background:var(--acc-l);color:var(--acc);font:600 12px var(--ff);padding:4px 10px;border-radius:20px;margin-left:12px}
#rp-toggle{background:0;border:1px solid var(--bdr);font-size:18px;cursor:pointer;padding:6px 10px;color:var(--txt2);border-radius:var(--rx);transition:all .15s;margin-left:8px}
#rp-toggle:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-l)}
#rp-toggle.active{background:var(--acc-l);color:var(--acc);border-color:var(--acc)}
#del-sess-btn{background:0;border:0;font-size:18px;cursor:pointer;padding:8px 10px;color:var(--txt2);border-radius:var(--rx);transition:all .15s;margin-left:4px}
#del-sess-btn:hover{color:var(--dng);background:rgba(239,68,68,.08)}

/* MESSAGES */
#messages{flex:1;overflow-y:auto;padding:24px 0;scroll-behavior:smooth}
#messages::-webkit-scrollbar{width:6px}
#messages::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:3px}
.mr{padding:20px 24px;display:flex;justify-content:center;animation:msgIn .35s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.mr.user{background:var(--ubg);border-bottom:1px solid var(--bdr-l)}
.mr.assistant{background:var(--abg);border-bottom:1px solid var(--bdr-l)}
.mi{max-width:var(--mw);width:100%;display:flex;gap:18px;align-items:flex-start}
.ma{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ma.u{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff}
.ma.a{background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff}
.mc{flex:1;min-width:0;line-height:1.75;overflow-wrap:break-word;word-break:break-word;font-size:16px}
.mc h1,.mc h2,.mc h3{margin:20px 0 10px;font-weight:700}
.mc h1{font-size:1.5em}.mc h2{font-size:1.25em}.mc h3{font-size:1.1em}
.mc p{margin:10px 0}.mc p:first-child{margin-top:0}.mc p:last-child{margin-bottom:0}
.mc ul,.mc ol{margin:10px 0;padding-left:26px}.mc li{margin:5px 0}
.mc code{background:#f1f3f5;padding:3px 7px;border-radius:5px;font:0.88em var(--fm);color:#e11d48;border:1px solid #e9ecef}
.mc pre{background:#1e1e2e;color:#cdd6f4;border-radius:var(--rs);padding:18px;margin:14px 0;overflow-x:auto;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.1);border:1px solid rgba(255,255,255,.06)}
.mc pre code{background:0;padding:0;border-radius:0;color:inherit;font-size:14px;line-height:1.6;border:0}
.cc-btn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.08);color:#9ca3af;border:1px solid rgba(255,255,255,.1);border-radius:var(--rx);padding:5px 12px;font:12px var(--ff);cursor:pointer;transition:all .15s}
.cc-btn:hover{background:rgba(255,255,255,.15);color:#e4e5e7}
.mc blockquote{border-left:4px solid var(--acc);padding:10px 16px;color:var(--txt2);margin:12px 0;background:var(--acc-l);border-radius:0 var(--rx) var(--rx) 0}
.mc table{border-collapse:collapse;margin:14px 0;width:100%;border-radius:var(--rs);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.mc th,.mc td{border:1px solid var(--bdr);padding:10px 14px;text-align:left;font-size:15px}
.mc th{background:#f1f5f9;font-weight:600}
.mc a{color:var(--acc);text-decoration:none;font-weight:500}.mc a:hover{text-decoration:underline}
.mc hr{border:none;border-top:1px solid var(--bdr);margin:16px 0}
.mc strong{font-weight:650}

/* TOOL CARDS */
.tc{border-radius:var(--rs);padding:16px 20px;margin:12px 0;border:1px solid;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:box-shadow .2s}
.tc:hover{box-shadow:var(--sh)}
.tc-w{background:linear-gradient(135deg,#e0f2fe,#f0f9ff);border-color:#7dd3fc}
.tc-c{background:linear-gradient(135deg,#dcfce7,#f0fdf4);border-color:#86efac}
.tc-s{background:linear-gradient(135deg,#fef3c7,#fffbeb);border-color:#fbbf24}
.tc-g{background:linear-gradient(135deg,#ede9fe,#f5f3ff);border-color:#c4b5fd}
.tc-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;font:600 15px var(--ff)}
.tc-icon{font-size:22px}
.tc-label{font:600 11px var(--ff);text-transform:uppercase;letter-spacing:.8px;color:var(--txt2);background:rgba(0,0,0,.05);padding:2px 8px;border-radius:4px;margin-left:auto}
.tc-body{font-size:15px}
.td-row{display:flex;padding:6px 0;align-items:baseline}
.td-row+.td-row{border-top:1px solid rgba(0,0,0,.05)}
.td-row .lb{color:var(--txt2);width:80px;flex-shrink:0;font-size:14px}
.td-row .vl{font-weight:600;font-size:15px}
.td-row .vl.mono{font-family:var(--fm)}
.td-row .vl.big{font-size:20px;color:var(--acc)}
/* search results in tool card */
.sr-item{padding:8px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.sr-item:last-child{border-bottom:0}
.sr-title{font-weight:600;font-size:14px;color:var(--acc)}
.sr-url{font-size:12px;color:var(--suc);margin:2px 0;word-break:break-all}
.sr-snip{font-size:13px;color:var(--txt2);line-height:1.5}

/* TYPING */
.typing{display:inline-flex;gap:5px;padding:6px 0}
.typing span{width:8px;height:8px;background:var(--acc);border-radius:50%;animation:typ 1.2s infinite;opacity:.5}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes typ{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-5px)}}

/* WELCOME */
#welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:60px 24px;text-align:center}
.w-icon{width:72px;height:72px;background:linear-gradient(135deg,var(--acc),#a78bfa);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:24px;box-shadow:0 8px 32px rgba(99,102,241,.25)}
#welcome h2{font-size:28px;font-weight:800;margin-bottom:10px;letter-spacing:-.5px}
#welcome p{color:var(--txt2);margin-bottom:10px;font-size:16px}
.w-feats{display:flex;gap:20px;margin:20px 0 36px;flex-wrap:wrap;justify-content:center}
.w-feat{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--txt2);background:var(--bg2);padding:8px 16px;border-radius:20px;border:1px solid var(--bdr);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:680px;width:100%}
.sg-card{padding:18px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rs);cursor:pointer;text-align:left;font:15px var(--ff);color:var(--txt);transition:all .2s;line-height:1.55;box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative;overflow:hidden}
.sg-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--acc),#a78bfa);opacity:0;transition:opacity .2s}
.sg-card:hover{border-color:var(--acc);box-shadow:0 4px 12px rgba(0,0,0,.1);transform:translateY(-2px)}
.sg-card:hover::before{opacity:1}
.sg-icon{font-size:24px;margin-bottom:10px;display:block}
.sg-sub{font-size:14px;color:var(--txt2);margin-top:4px}

/* INPUT AREA */
#input-area{padding:16px 24px 24px;background:linear-gradient(to top,var(--bg) 80%,transparent);display:flex;flex-direction:column;align-items:center}
#input-wrap{max-width:var(--mw);width:100%}
#input-tb{display:flex;align-items:center;gap:14px;margin-bottom:10px;padding:0 6px}
.tg-label{display:flex;align-items:center;gap:9px;font:500 14px var(--ff);color:var(--txt2);cursor:pointer;user-select:none}
.tg-sw{position:relative;width:40px;height:22px;appearance:none;-webkit-appearance:none;background:#d1d5db;border-radius:11px;cursor:pointer;transition:background .2s;flex-shrink:0}
.tg-sw:checked{background:var(--acc)}
.tg-sw::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tg-sw:checked::after{transform:translateX(18px)}
#up-btn{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rx);padding:6px 14px;font:500 14px var(--ff);cursor:pointer;color:var(--txt2);transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
#up-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-l)}
#input-row{display:flex;gap:12px;align-items:flex-end;background:var(--bg2);border:1.5px solid var(--bdr);border-radius:var(--r);padding:12px 16px;box-shadow:0 4px 12px rgba(0,0,0,.1);transition:all .2s}
#input-row:focus-within{border-color:var(--acc);box-shadow:0 4px 12px rgba(0,0,0,.1),0 0 0 3px var(--acc-g)}
#msg-in{flex:1;border:0;outline:0;resize:none;font:16px var(--ff);line-height:1.55;max-height:160px;min-height:26px;color:var(--txt);background:0 0}
#msg-in::placeholder{color:#adb5bd}
#send-btn{padding:10px 22px;background:linear-gradient(135deg,var(--acc),#818cf8);color:#fff;border:0;border-radius:var(--rs);font:600 15px var(--ff);cursor:pointer;transition:all .2s;white-space:nowrap;box-shadow:0 2px 8px rgba(99,102,241,.3)}
#send-btn:hover{box-shadow:0 4px 12px rgba(99,102,241,.4);transform:translateY(-1px)}
#send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
#send-btn.stop-btn{background:linear-gradient(135deg,var(--dng),#f87171);box-shadow:0 2px 8px rgba(239,68,68,.3)}
.in-hint{font-size:12px;color:var(--txt2);margin-top:8px;padding:0 6px;opacity:.7}

/* RIGHT PANEL */
#right-panel{width:var(--rw);min-width:var(--rw);background:var(--bg2);border-left:1px solid var(--bdr);display:flex;flex-direction:column;overflow-y:auto;transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:900}
#right-panel.hidden{display:none}
#right-panel::-webkit-scrollbar{width:4px}
#right-panel::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:2px}
.rp-section{border-bottom:1px solid var(--bdr)}
.rp-hdr{display:flex;align-items:center;gap:10px;padding:16px 18px;cursor:pointer;font:600 15px var(--ff);color:var(--txt);user-select:none;transition:background .15s}
.rp-hdr:hover{background:#fafbfc}
.rp-hdr-icon{font-size:18px}
.rp-hdr-arrow{margin-left:auto;font-size:12px;color:var(--txt2);transition:transform .2s}
.rp-hdr.open .rp-hdr-arrow{transform:rotate(180deg)}
.rp-body{padding:0 18px 16px;display:none}
.rp-hdr.open+.rp-body{display:block}

/* Tools list */
.tool-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bdr-l);border-radius:var(--rs);margin-bottom:8px;background:#fafbfc;transition:all .15s}
.tool-item:hover{border-color:var(--acc);background:var(--acc-l)}
.tool-icon-sm{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tool-icon-weather{background:#dbeafe;color:#2563eb}
.tool-icon-calc{background:#dcfce7;color:#16a34a}
.tool-icon-search{background:#fef3c7;color:#d97706}
.tool-info{flex:1;min-width:0}
.tool-name{font:600 14px var(--ff);color:var(--txt)}
.tool-desc{font-size:12px;color:var(--txt2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-status{width:8px;height:8px;border-radius:50%;background:var(--suc);flex-shrink:0}

/* Knowledge files */
.kb-file{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bdr-l);border-radius:var(--rs);margin-bottom:8px;background:#fafbfc}
.kb-file-icon{font-size:18px}
.kb-file-info{flex:1;min-width:0}
.kb-file-name{font:600 13px var(--ff);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-file-chunks{font-size:12px;color:var(--txt2)}
.kb-file-del{background:0;border:0;cursor:pointer;color:var(--txt2);font-size:14px;padding:4px;border-radius:var(--rx);transition:all .15s}
.kb-file-del:hover{color:var(--dng);background:rgba(239,68,68,.1)}
.kb-empty{font-size:13px;color:var(--txt2);text-align:center;padding:16px 0}
.kb-upload-area{border:2px dashed var(--bdr);border-radius:var(--rs);padding:20px;text-align:center;cursor:pointer;transition:all .2s;margin-top:8px}
.kb-upload-area:hover{border-color:var(--acc);background:var(--acc-l)}
.kb-upload-icon{font-size:28px;margin-bottom:6px}
.kb-upload-text{font-size:13px;color:var(--txt2)}

/* Settings */
.st-group{margin-bottom:14px}
.st-label{font:600 13px var(--ff);color:var(--txt2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.st-input{width:100%;padding:9px 12px;border:1px solid var(--bdr);border-radius:var(--rx);font:14px var(--ff);color:var(--txt);background:var(--bg);transition:border-color .2s;outline:none}
.st-input:focus{border-color:var(--acc)}
.st-select{width:100%;padding:9px 12px;border:1px solid var(--bdr);border-radius:var(--rx);font:14px var(--ff);color:var(--txt);background:var(--bg);cursor:pointer;outline:none}
.st-select:focus{border-color:var(--acc)}
.st-save{padding:8px 18px;background:var(--acc);color:#fff;border:0;border-radius:var(--rx);font:500 14px var(--ff);cursor:pointer;transition:background .2s;width:100%;margin-top:4px}
.st-save:hover{background:var(--acc-h)}

/* TOAST */
#toast-ct{position:fixed;top:24px;right:24px;z-index:3000;display:flex;flex-direction:column;gap:10px}
.toast{padding:14px 22px;border-radius:var(--rs);font:500 14px var(--ff);box-shadow:var(--sl);animation:tIn .35s cubic-bezier(.4,0,.2,1);max-width:400px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(12px)}
.toast.success{background:rgba(5,150,105,.95);color:#fff}
.toast.error{background:rgba(185,28,28,.95);color:#fff}
.toast.info{background:rgba(37,99,235,.95);color:#fff}
@keyframes tIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* BACKDROP */
#sb-bd{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none;backdrop-filter:blur(2px)}

/* RESPONSIVE */
@media(max-width:1024px){
  #right-panel{position:fixed;right:0;top:0;bottom:0;transform:translateX(100%);box-shadow:-4px 0 20px rgba(0,0,0,.1)}
  #right-panel.show{transform:translateX(0)}
  #right-panel.hidden{display:flex;transform:translateX(100%)}
}
@media(max-width:768px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #sb-bd.open{display:block}
  #sb-toggle{display:block}
  #chat-main{width:100%}
  .mi{padding:0 4px}
  .mr{padding:16px}
  #msg-in{font-size:16px}
  .sg-grid{grid-template-columns:1fr}
  #welcome h2{font-size:24px}
  .w-feats{flex-direction:column;align-items:center}
}
</style>
</head>
<body>
<div id="app">
  <div id="sb-bd" onclick="ui.toggleSidebar()"></div>

  <!-- LEFT SIDEBAR -->
  <aside id="sidebar">
    <div class="sb-hdr">
      <div class="sb-brand"><div class="sb-logo">&#9889;</div><span class="sb-name">Kevin</span></div>
      <button id="new-chat-btn" onclick="sessions.create()">&#10010; 新建对话</button>
    </div>
    <div id="session-list"></div>
    <div class="sb-foot"><span class="sb-dot"></span>Claude via OpenRouter</div>
  </aside>

  <!-- MAIN -->
  <main id="chat-main">
    <header id="top-bar">
      <button id="sb-toggle" onclick="ui.toggleSidebar()">&#9776;</button>
      <span id="cur-title">新对话</span>
      <span class="tb-badge">&#9889; Claude Sonnet</span>
      <button id="rp-toggle" onclick="ui.toggleRightPanel()" title="工具与设置">&#9881;</button>
      <button id="del-sess-btn" onclick="sessions.deleteCurrent()" title="删除对话">&#128465;</button>
    </header>

    <div id="messages">
      <div id="welcome">
        <div class="w-icon">&#9889;</div>
        <h2>Kevin小助手</h2>
        <p>基于 Claude 大语言模型的智能对话助手</p>
        <div class="w-feats">
          <div class="w-feat"><span>&#128172;</span> 多轮对话</div>
          <div class="w-feat"><span>&#128295;</span> 工具调用</div>
          <div class="w-feat"><span>&#128218;</span> 知识库</div>
          <div class="w-feat"><span>&#127760;</span> 联网搜索</div>
        </div>
        <div class="sg-grid">
          <button class="sg-card" onclick="useSuggestion('北京今天天气怎么样？')"><span class="sg-icon">&#9728;&#65039;</span><strong>查询天气</strong><span class="sg-sub">北京今天天气怎么样？</span></button>
          <button class="sg-card" onclick="useSuggestion('计算 (100 - 37) * 2.5')"><span class="sg-icon">&#129518;</span><strong>数学计算</strong><span class="sg-sub">计算 (100 - 37) * 2.5</span></button>
          <button class="sg-card" onclick="useSuggestion('搜索最新的人工智能发展动态')"><span class="sg-icon">&#127760;</span><strong>联网搜索</strong><span class="sg-sub">搜索最新的人工智能动态</span></button>
        </div>
      </div>
    </div>

    <div id="input-area">
      <div id="input-wrap">
        <div id="input-tb">
          <label class="tg-label"><input type="checkbox" id="kb-toggle" class="tg-sw" onchange="state.useKnowledge=this.checked"><span>&#128218; 知识库</span></label>
          <button id="up-btn" onclick="document.getElementById('file-in').click()">&#128206; 上传文件</button>
          <input type="file" id="file-in" accept=".txt,.md,.docx" hidden onchange="handleFileUpload(this)">
        </div>
        <div id="input-row">
          <textarea id="msg-in" placeholder="输入消息，按 Enter 发送..." rows="1" onkeydown="handleKey(event)" oninput="ui.autoResize()"></textarea>
          <button id="send-btn" onclick="handleSend()">发送</button>
        </div>
        <div class="in-hint">Shift + Enter 换行</div>
      </div>
    </div>
  </main>

  <!-- RIGHT PANEL -->
  <div id="right-panel" class="hidden">
    <!-- Tools -->
    <div class="rp-section">
      <div class="rp-hdr open" onclick="togglePanel(this)"><span class="rp-hdr-icon">&#128295;</span>可用工具<span class="rp-hdr-arrow">&#9660;</span></div>
      <div class="rp-body" id="tools-list"></div>
    </div>
    <!-- Knowledge -->
    <div class="rp-section">
      <div class="rp-hdr open" onclick="togglePanel(this)"><span class="rp-hdr-icon">&#128218;</span>知识库<span class="rp-hdr-arrow">&#9660;</span></div>
      <div class="rp-body" id="kb-panel">
        <div id="kb-files"></div>
        <div class="kb-upload-area" onclick="document.getElementById('file-in-rp').click()">
          <div class="kb-upload-icon">&#128206;</div>
          <div class="kb-upload-text">点击上传 .txt / .md / .docx 文件</div>
        </div>
        <input type="file" id="file-in-rp" accept=".txt,.md,.docx" hidden onchange="handleFileUpload(this)">
      </div>
    </div>
    <!-- Settings -->
    <div class="rp-section">
      <div class="rp-hdr open" onclick="togglePanel(this)"><span class="rp-hdr-icon">&#9881;</span>设置<span class="rp-hdr-arrow">&#9660;</span></div>
      <div class="rp-body" id="settings-panel">
        <div class="st-group">
          <div class="st-label">模型</div>
          <input class="st-input" id="st-model" value="" placeholder="anthropic/claude-sonnet-4">
        </div>
        <div class="st-group">
          <div class="st-label">Prompt 版本</div>
          <select class="st-select" id="st-prompt"></select>
        </div>
        <button class="st-save" onclick="saveSettings()">保存设置</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-ct"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
<script>
const state={currentSessionId:null,sessions:[],isStreaming:false,useKnowledge:false,abortController:null,streamingFullText:'',rightPanelOpen:false};

marked.setOptions({highlight:(code,lang)=>{if(lang&&hljs.getLanguage(lang))return hljs.highlight(code,{language:lang}).value;return hljs.highlightAuto(code).value},breaks:true,gfm:true});

function getWelcomeHtml(){return `<div id="welcome"><div class="w-icon">&#9889;</div><h2>Kevin小助手</h2><p>基于 Claude 大语言模型的智能对话助手</p><div class="w-feats"><div class="w-feat"><span>&#128172;</span> 多轮对话</div><div class="w-feat"><span>&#128295;</span> 工具调用</div><div class="w-feat"><span>&#128218;</span> 知识库</div><div class="w-feat"><span>&#127760;</span> 联网搜索</div></div><div class="sg-grid"><button class="sg-card" onclick="useSuggestion('北京今天天气怎么样？')"><span class="sg-icon">&#9728;&#65039;</span><strong>查询天气</strong><span class="sg-sub">北京今天天气怎么样？</span></button><button class="sg-card" onclick="useSuggestion('计算 (100 - 37) * 2.5')"><span class="sg-icon">&#129518;</span><strong>数学计算</strong><span class="sg-sub">计算 (100 - 37) * 2.5</span></button><button class="sg-card" onclick="useSuggestion('搜索最新的人工智能发展动态')"><span class="sg-icon">&#127760;</span><strong>联网搜索</strong><span class="sg-sub">搜索最新的人工智能动态</span></button></div></div>`}

/* API */
const api={
  chat:(sid,msg,uk)=>fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,message:msg,use_knowledge:uk}),signal:state.abortController?.signal}),
  getHistory:async(sid)=>{const r=await fetch(`/sessions/${encodeURIComponent(sid)}/history`);if(r.status===404)return null;if(!r.ok)throw new Error('Fail');return r.json()},
  deleteSession:(sid)=>fetch(`/sessions/${encodeURIComponent(sid)}`,{method:'DELETE'}),
  uploadKnowledge:async(f)=>{const fd=new FormData();fd.append('file',f);const r=await fetch('/knowledge/upload',{method:'POST',body:fd});if(!r.ok){const e=await r.json();throw new Error(e.detail||'Fail')}return r.json()},
  healthCheck:async()=>{try{return(await fetch('/health')).ok}catch{return false}},
  getTools:async()=>{try{return(await fetch('/tools')).json()}catch{return{tools:[]}}},
  getKnowledgeFiles:async()=>{try{return(await fetch('/knowledge/files')).json()}catch{return{files:[]}}},
  deleteKnowledgeFile:async(fn)=>fetch(`/knowledge/files/${encodeURIComponent(fn)}`,{method:'DELETE'}),
  getSettings:async()=>{try{return(await fetch('/settings')).json()}catch{return null}},
  saveSettings:async(data)=>fetch('/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),
};

/* SESSIONS */
const sessions={
  load(){try{state.sessions=JSON.parse(localStorage.getItem('smartbot_sessions')||'[]')}catch{state.sessions=[]}},
  save(){localStorage.setItem('smartbot_sessions',JSON.stringify(state.sessions))},
  create(){const id=crypto.randomUUID?crypto.randomUUID():'s-'+Date.now();const s={id,title:'新对话',created_at:new Date().toISOString()};state.sessions.unshift(s);this.save();this.switchTo(id)},
  async switchTo(id){state.currentSessionId=id;ui.updateSidebar();ui.updateTitle();const el=document.getElementById('messages');el.innerHTML='';const d=await api.getHistory(id);if(d&&d.messages&&d.messages.length>0)renderer.renderHistory(d.messages);else el.innerHTML=getWelcomeHtml();if(window.innerWidth<=768)ui.toggleSidebar(false)},
  updateTitle(id,msg){const s=state.sessions.find(x=>x.id===id);if(s&&s.title==='新对话'&&msg){s.title=msg.slice(0,20)+(msg.length>20?'...':'');this.save();ui.updateSidebar();ui.updateTitle()}},
  async deleteCurrent(){if(!state.currentSessionId)return;if(!confirm('确定删除这个对话吗？'))return;await api.deleteSession(state.currentSessionId);state.sessions=state.sessions.filter(s=>s.id!==state.currentSessionId);this.save();if(state.sessions.length>0)this.switchTo(state.sessions[0].id);else{state.currentSessionId=null;ui.updateSidebar();ui.updateTitle();document.getElementById('messages').innerHTML=getWelcomeHtml()}},
};
sessions.deleteById=async function(id){if(!confirm('确定删除？'))return;await api.deleteSession(id);state.sessions=state.sessions.filter(s=>s.id!==id);this.save();if(id===state.currentSessionId){if(state.sessions.length>0)this.switchTo(state.sessions[0].id);else{state.currentSessionId=null;ui.updateSidebar();ui.updateTitle();document.getElementById('messages').innerHTML=getWelcomeHtml()}}else ui.updateSidebar()};

/* RENDERER */
const renderer={
  esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML},
  renderUser(c){const el=document.getElementById('messages');const w=document.getElementById('welcome');if(w)w.remove();const r=document.createElement('div');r.className='mr user';r.innerHTML=`<div class="mi"><div class="ma u">&#128100;</div><div class="mc">${this.esc(c)}</div></div>`;el.appendChild(r)},
  renderAssistant(c){const el=document.getElementById('messages');const r=document.createElement('div');r.className='mr assistant';r.innerHTML=`<div class="mi"><div class="ma a">&#9889;</div><div class="mc">${marked.parse(c)}</div></div>`;el.appendChild(r);this.addCopy(r)},
  createPlaceholder(){const el=document.getElementById('messages');const r=document.createElement('div');r.className='mr assistant';r.id='streaming';r.innerHTML=`<div class="mi"><div class="ma a">&#9889;</div><div class="mc"><div class="typing"><span></span><span></span><span></span></div></div></div>`;el.appendChild(r);return r},
  updateStream(el,txt){el.querySelector('.mc').innerHTML=marked.parse(txt)},
  finalizeStream(el,txt){el.querySelector('.mc').innerHTML=marked.parse(txt);el.removeAttribute('id');this.addCopy(el)},
  renderToolCard(name,args,result){
    const c=document.createElement('div');
    if(name==='get_weather'&&result&&!result.error){
      let e='\u2600\uFE0F';const cd=result.condition||'';if(cd.includes('\u96E8'))e='\uD83C\uDF27\uFE0F';else if(cd.includes('\u9634')||cd.includes('\u4E91'))e='\u2601\uFE0F';else if(cd.includes('\u96EA'))e='\u2744\uFE0F';
      c.className='tc tc-w';c.innerHTML=`<div class="tc-hdr"><span class="tc-icon">${e}</span>天气查询<span class="tc-label">Tool</span></div><div class="tc-body"><div class="td-row"><span class="lb">城市</span><span class="vl">${this.esc(result.city)}</span></div><div class="td-row"><span class="lb">温度</span><span class="vl">${this.esc(result.temperature)}</span></div><div class="td-row"><span class="lb">天气</span><span class="vl">${this.esc(result.condition)}</span></div></div>`;
    } else if(name==='calculator'&&result){
      c.className='tc tc-c';const d=result.error||result.result;c.innerHTML=`<div class="tc-hdr"><span class="tc-icon">&#129518;</span>计算结果<span class="tc-label">Tool</span></div><div class="tc-body"><div class="td-row"><span class="lb">表达式</span><span class="vl mono">${this.esc(String(result.expression||args.expression||''))}</span></div><div class="td-row"><span class="lb">结果</span><span class="vl mono big">${this.esc(String(d))}</span></div></div>`;
    } else if(name==='web_search'&&result&&result.results){
      c.className='tc tc-s';let rhtml=result.results.map(r=>`<div class="sr-item"><div class="sr-title">${this.esc(r.title)}</div><div class="sr-url">${this.esc(r.url)}</div><div class="sr-snip">${this.esc(r.snippet)}</div></div>`).join('');
      c.innerHTML=`<div class="tc-hdr"><span class="tc-icon">&#127760;</span>联网搜索: ${this.esc(result.query)}<span class="tc-label">Tool</span></div><div class="tc-body">${rhtml}</div>`;
    } else {
      c.className='tc tc-g';c.innerHTML=`<div class="tc-hdr"><span class="tc-icon">&#128295;</span>工具: ${this.esc(name)}<span class="tc-label">Tool</span></div><div class="tc-body"><pre style="margin:4px 0;font-size:13px;background:rgba(0,0,0,.03);padding:10px;border-radius:6px">${this.esc(JSON.stringify(result||args,null,2))}</pre></div>`;
    }
    return c;
  },
  renderHistory(msgs){
    const el=document.getElementById('messages');el.innerHTML='';let i=0;
    while(i<msgs.length){const m=msgs[i];
      if(m.role==='user'){this.renderUser(m.content);i++}
      else if(m.role==='assistant'&&m.tool_calls&&m.tool_calls.length>0){
        for(const tc of m.tool_calls){let a={};try{a=JSON.parse(tc.function.arguments)}catch{}let res=null;for(let j=i+1;j<msgs.length;j++){if(msgs[j].role==='tool'&&msgs[j].tool_call_id===tc.id){try{res=JSON.parse(msgs[j].content)}catch{}break}}
        const card=this.renderToolCard(tc.function.name,a,res);const row=document.createElement('div');row.className='mr assistant';const inn=document.createElement('div');inn.className='mi';inn.innerHTML=`<div class="ma a">&#9889;</div>`;const cd=document.createElement('div');cd.className='mc';cd.appendChild(card);inn.appendChild(cd);row.appendChild(inn);el.appendChild(row)}
        i++;while(i<msgs.length&&msgs[i].role==='tool')i++}
      else if(m.role==='assistant'){this.renderAssistant(m.content);i++}
      else i++}
    ui.scrollBottom()},
  addCopy(ct){ct.querySelectorAll('pre').forEach(p=>{if(p.querySelector('.cc-btn'))return;const b=document.createElement('button');b.className='cc-btn';b.textContent='复制';b.onclick=async()=>{const c=p.querySelector('code');try{await navigator.clipboard.writeText(c?c.textContent:p.textContent);b.textContent='已复制 ✓';setTimeout(()=>b.textContent='复制',2000)}catch{}};p.style.position='relative';p.appendChild(b)})},
};

/* UI */
const ui={
  init(){sessions.load();this.updateSidebar();if(state.sessions.length>0)sessions.switchTo(state.sessions[0].id);api.healthCheck().then(ok=>{if(!ok)showToast('无法连接到服务器','error')});this.loadRightPanel()},
  updateSidebar(){const l=document.getElementById('session-list');l.innerHTML='';for(const s of state.sessions){const d=document.createElement('div');d.className='si'+(s.id===state.currentSessionId?' active':'');d.innerHTML=`<span class="si-icon">&#128172;</span><span class="si-title">${renderer.esc(s.title)}</span><button class="si-del" title="删除" onclick="event.stopPropagation();sessions.deleteById('${s.id}')">&#128465;</button>`;d.onclick=()=>sessions.switchTo(s.id);l.appendChild(d)}},
  updateTitle(){const t=document.getElementById('cur-title');const s=state.sessions.find(x=>x.id===state.currentSessionId);t.textContent=s?s.title:'新对话'},
  toggleSidebar(f){const s=document.getElementById('sidebar'),b=document.getElementById('sb-bd');const o=f!==undefined?f:!s.classList.contains('open');s.classList.toggle('open',o);b.classList.toggle('open',o)},
  toggleRightPanel(){const p=document.getElementById('right-panel'),btn=document.getElementById('rp-toggle');state.rightPanelOpen=!state.rightPanelOpen;if(state.rightPanelOpen){p.classList.remove('hidden');p.classList.add('show');btn.classList.add('active');this.loadRightPanel()}else{p.classList.add('hidden');p.classList.remove('show');btn.classList.remove('active')}},
  async loadRightPanel(){await Promise.all([this.loadTools(),this.loadKnowledge(),this.loadSettings()])},
  async loadTools(){const d=await api.getTools();const el=document.getElementById('tools-list');if(!d.tools)return;const icons={'get_weather':['&#9728;&#65039;','tool-icon-weather'],'calculator':['&#129518;','tool-icon-calc'],'web_search':['&#127760;','tool-icon-search']};el.innerHTML=d.tools.map(t=>{const[ic,cls]=icons[t.name]||['&#128295;',''];return `<div class="tool-item"><div class="tool-icon-sm ${cls}">${ic}</div><div class="tool-info"><div class="tool-name">${renderer.esc(t.name)}</div><div class="tool-desc">${renderer.esc(t.description)}</div></div><div class="tool-status"></div></div>`}).join('')},
  async loadKnowledge(){const d=await api.getKnowledgeFiles();const el=document.getElementById('kb-files');if(!d.files||d.files.length===0){el.innerHTML='<div class="kb-empty">暂无知识库文件</div>';return}el.innerHTML=d.files.map(f=>`<div class="kb-file"><span class="kb-file-icon">&#128196;</span><div class="kb-file-info"><div class="kb-file-name">${renderer.esc(f.filename)}</div><div class="kb-file-chunks">${f.chunks} 个片段</div></div><button class="kb-file-del" onclick="deleteKbFile('${renderer.esc(f.filename)}')">&#128465;</button></div>`).join('')},
  async loadSettings(){const d=await api.getSettings();if(!d)return;document.getElementById('st-model').value=d.chat_model||'';const sel=document.getElementById('st-prompt');sel.innerHTML=(d.available_prompt_versions||[]).map(v=>`<option value="${v}"${v===d.prompt_version?' selected':''}>${v}</option>`).join('')},
  autoResize(){const t=document.getElementById('msg-in');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px'},
  scrollBottom(){const el=document.getElementById('messages');requestAnimationFrame(()=>el.scrollTop=el.scrollHeight)},
  setLoading(l){const b=document.getElementById('send-btn'),i=document.getElementById('msg-in');if(l){b.textContent='停止';b.className='stop-btn';b.id='send-btn';i.disabled=true}else{b.textContent='发送';b.className='';b.id='send-btn';i.disabled=false;i.focus()}},
};

function togglePanel(hdr){hdr.classList.toggle('open')}

async function deleteKbFile(fn){if(!confirm(`删除 ${fn}？`))return;await api.deleteKnowledgeFile(fn);showToast(`已删除 ${fn}`,'success');ui.loadKnowledge()}

async function saveSettings(){
  const model=document.getElementById('st-model').value.trim();
  const prompt=document.getElementById('st-prompt').value;
  const data={};if(model)data.chat_model=model;if(prompt)data.prompt_version=prompt;
  try{const r=await api.saveSettings(data);if(r.ok)showToast('设置已保存','success');else{const e=await r.json();showToast(e.detail||'保存失败','error')}}catch(e){showToast('保存失败','error')}
}

/* SEND */
async function handleSend(){
  if(state.isStreaming){state.abortController?.abort();return}
  const inp=document.getElementById('msg-in');const msg=inp.value.trim();if(!msg)return;
  if(!state.currentSessionId){sessions.create();await new Promise(r=>setTimeout(r,50))}
  sessions.updateTitle(state.currentSessionId,msg);
  renderer.renderUser(msg);inp.value='';ui.autoResize();ui.scrollBottom();
  const el=renderer.createPlaceholder();ui.scrollBottom();
  state.isStreaming=true;state.abortController=new AbortController();state.streamingFullText='';ui.setLoading(true);
  let rf=null,pr=false;
  function sched(){if(pr)return;pr=true;rf=requestAnimationFrame(()=>{renderer.updateStream(el,state.streamingFullText);ui.scrollBottom();pr=false})}
  try{
    const r=await api.chat(state.currentSessionId,msg,state.useKnowledge);
    if(!r.ok){let em='Request failed';try{const e=await r.json();em=e.detail||em}catch{}throw new Error(em)}
    const reader=r.body.getReader();const dec=new TextDecoder();let buf='';
    while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
      for(const ln of lines){const t=ln.trim();if(!t.startsWith('data: '))continue;try{const p=JSON.parse(t.slice(6));if(p.type==='content_block_delta'){state.streamingFullText+=p.text;sched()}}catch{}}}
  }catch(e){if(e.name==='AbortError')state.streamingFullText+='\n\n*[已停止]*';else{showToast(e.message,'error');if(!state.streamingFullText)state.streamingFullText='*错误: '+e.message+'*'}}
  finally{if(rf)cancelAnimationFrame(rf);state.isStreaming=false;state.abortController=null;ui.setLoading(false);
    if(state.streamingFullText)renderer.finalizeStream(el,state.streamingFullText);else el.remove();
    ui.scrollBottom();await renderToolCards()}
}

async function renderToolCards(){if(!state.currentSessionId)return;try{const d=await api.getHistory(state.currentSessionId);if(!d?.messages)return;if(d.messages.some(m=>m.tool_calls?.length>0))renderer.renderHistory(d.messages)}catch{}}

function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend()}}
function useSuggestion(t){document.getElementById('msg-in').value=t;ui.autoResize();handleSend()}

/* UPLOAD */
function handleFileUpload(el){const f=el.files[0];if(f){doUpload(f);el.value=''}}
async function doUpload(f){const ext=f.name.split('.').pop().toLowerCase();if(!['txt','md'].includes(ext)){showToast('仅支持 .txt 和 .md','error');return}try{showToast('上传中...','info');const r=await api.uploadKnowledge(f);showToast(`上传成功: ${r.filename}，${r.chunks} 个片段`,'success');document.getElementById('kb-toggle').checked=true;state.useKnowledge=true;ui.loadKnowledge()}catch(e){showToast('上传失败: '+e.message,'error')}}

/* TOAST */
function showToast(m,t='info'){const icons={success:'\u2705',error:'\u274C',info:'\u2139\uFE0F'};const ct=document.getElementById('toast-ct');const d=document.createElement('div');d.className='toast '+t;d.innerHTML=`<span>${icons[t]||''}</span>${renderer.esc(m)}`;ct.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transform='translateX(20px)';d.style.transition='all .3s';setTimeout(()=>d.remove(),300)},3500)}

document.addEventListener('DOMContentLoaded',()=>ui.init());
</script>
</body>
</html>
